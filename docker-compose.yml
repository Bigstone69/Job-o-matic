version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jobom atic-db
    environment:
      POSTGRES_DB: jobmanager
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

